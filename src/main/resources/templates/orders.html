<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order History</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<div class="container mt-4">
    <h2 class="mb-4" th:text="#{nav.my_orders}">My Orders</h2>

    <div th:if="${orderHistoryError}" class="alert alert-danger" role="alert">
        <span th:text="${orderHistoryError}">Error fetching orders.</span>
    </div>

    <div th:if="${orders == null || orders.isEmpty()}"
         th:text="#{order.empty}"
         class="alert alert-info"
         role="alert">
    </div>


    <div th:if="${orders != null && !orders.isEmpty()}">
        <div class="accordion" id="ordersAccordion">
            <div class="accordion-item" th:each="order, orderStat : ${orders}">
                <h2 class="accordion-header" th:id="'heading' + ${orderStat.index}">
                    <button class="accordion-button" type="button" data-bs-toggle="collapse" 
                            th:data-bs-target="'#collapse' + ${orderStat.index}" 
                            aria-expanded="true" th:aria-controls="'collapse' + ${orderStat.index}">
                        <span th:text="'Order #' + ${order.id} + ' - ' + ${#temporals.format(order.orderDate, 'yyyy-MM-dd HH:mm')}">Order #123 - 2025-04-28 16:00</span>
                        <span class="ms-auto me-3" th:text="${#numbers.formatCurrency(order.totalAmount)}">$0.00</span>
                    </button>
                </h2>
                <div th:id="'collapse' + ${orderStat.index}" class="accordion-collapse collapse" 
                     th:aria-labelledby="'heading' + ${orderStat.index}" data-bs-parent="#ordersAccordion">
                    <div class="accordion-body">
                        <table class="table table-sm">
                            <thead>
                                <tr>
                                    <th th:text="#{cart.book}">Book</th>
                                    <th th:text="#{cart.quantity}">Quantity</th>
                                    <th th:text="#{cart.price}">Price</th>
                                    <th th:text="#{cart.subtotal}">Subtotal</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="item : ${order.orderItems}">
                                    <td th:text="${item.book.title}">Book Title</td>
                                    <td th:text="${item.quantity}">1</td>
                                    <td th:text="${#numbers.formatCurrency(item.price)}">$0.00</td>
                                    <td th:text="${#numbers.formatCurrency(item.subtotal)}">$0.00</td>
                                </tr>
                            </tbody>
                            <tfoot>
                                <tr>
                                    <td colspan="3" class="text-end"><strong th:text="#{cart.total}">Total</strong></td>
                                    <td><strong th:text="${#numbers.formatCurrency(order.totalAmount)}">$0.00</strong></td>
                                </tr>
                            </tfoot>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="mt-3">
        <a th:href="@{/books}" class="btn btn-primary" th:text="#{cart.continue_shopping}">Continue Shopping</a>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
