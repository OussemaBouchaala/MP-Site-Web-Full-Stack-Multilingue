<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{order.title}">Order Confirmation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<div class="container mt-4">
    <h2 class="mb-4" th:text="#{order.title}">Order Confirmation</h2>

    <div th:if="${orderError}" class="alert alert-danger" role="alert">
        <span th:text="${orderError}">Error processing order.</span>
    </div>

    <div th:if="${order}">
        <div class="alert alert-success" role="alert">
            <h4 class="alert-heading" th:text="#{order.success}">Order Placed Successfully!</h4>
            <p th:text="#{order.thank_you}">Thank you for your purchase!</p>
        </div>

        <div class="card">
            <div class="card-header" th:text="#{order.summary}">Order Summary</div>
            <div class="card-body">
                <p><strong><span th:text="#{order.id}">Order ID</span>:</strong> <span th:text="${order.id}">12345</span></p>
                <p><strong><span th:text="#{order.date}">Order Date</span>:</strong> <span th:text="${#temporals.format(order.orderDate, 'yyyy-MM-dd HH:mm')}">2025-04-28 16:00</span></p>
                <p><strong><span th:text="#{order.total}">Total Amount</span>:</strong> <span th:text="${#numbers.formatCurrency(order.totalAmount)}">$0.00</span></p>
                
                <h5 class="mt-4" th:text="#{order.items}">Ordered Items</h5>
                <table class="table table-sm">
                    <thead>
                        <tr>
                            <th th:text="#{cart.book}">Book</th>
                            <th th:text="#{cart.quantity}">Quantity</th>
                            <th th:text="#{cart.price}">Price</th>
                            <th th:text="#{cart.subtotal}">Subtotal</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="item : ${order.orderItems}">
                            <td th:text="${item.book.title}">Book Title</td>
                            <td th:text="${item.quantity}">1</td>
                            <td th:text="${#numbers.formatCurrency(item.price)}">$0.00</td>
                            <td th:text="${#numbers.formatCurrency(item.subtotal)}">$0.00</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        
        <div class="mt-3">
             <a th:href="@{/books}" class="btn btn-primary" th:text="#{cart.continue_shopping}">Continue Shopping</a>
             <a th:href="@{/order/history}" class="btn btn-secondary" th:text="#{nav.my_orders}">View Order History</a>
        </div>
    </div>

</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
