<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{books.title}">Available Books</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}"> <!-- Optional custom CSS -->
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<div class="container mt-4">
    <h2 class="mb-4" th:text="#{books.title}">Available Books</h2>
    
    <div class="row row-cols-1 row-cols-md-3 g-4">
        <div class="col" th:each="book : ${books}">
            <div class="card h-100">
                <div class="card-body">
                    <h5 class="card-title" th:text="${book.title}">Book Title</h5>
                    <p class="card-text">
                        <strong th:text="#{books.author} + ': '">Author: </strong>
                        <span th:text="${book.author}">Author Name</span>
                    </p>
                    <p class="card-text">
                        <strong th:text="#{books.price} + ': '">Price: </strong>
                        <span th:text="${#numbers.formatCurrency(book.price)}">$0.00</span>
                    </p>
                </div>
                <div class="card-footer">
                    <form th:action="@{/cart/add}" method="post">
                        <input type="hidden" name="bookId" th:value="${book.id}" />
                        <div class="input-group mb-3">
                            <input type="number" class="form-control" name="quantity" value="1" min="1" max="10" />
                            <button class="btn btn-primary" type="submit" th:text="#{books.add_to_cart}">Add to Cart</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
