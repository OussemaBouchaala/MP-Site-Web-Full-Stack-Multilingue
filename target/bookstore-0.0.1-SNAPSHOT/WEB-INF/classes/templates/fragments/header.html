<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <!-- Common head elements can go here if needed -->
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark" th:fragment="header">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/}" th:text="#{app.title}">Mini Bookstore</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/}" th:text="#{nav.home}">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/books}" th:text="#{nav.books}">Books</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/cart}" th:text="#{nav.cart}">Cart</a>
                </li>y

                 <li class="nav-item" >
                    <a class="nav-link" th:href="@{/order/history}" th:text="#{nav.my_orders}">My Orders</a>
                </li>
            </ul>
            <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                 <!-- Language Selector -->
                 <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" id="navbarDropdownLang" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                        <span th:text="${#locale.language == 'en' ? 'English' : 'French'}">Language</span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="navbarDropdownLang">
                        <li><a class="dropdown-item" th:href="@{?lang=en}" th:text="#{language.en}">English</a></li>
                        <li><a class="dropdown-item" th:href="@{?lang=fr}" th:text="#{language.fr}">French</a></li>
                    </ul>
                </li>
                <!-- Authentication Links -->
                <li class="nav-item" sec:authorize="!isAuthenticated()">
                    <a class="nav-link" th:href="@{/login}" th:text="#{nav.login}">Login</a>
                </li>
                <li class="nav-item" sec:authorize="!isAuthenticated()">
                    <a class="nav-link" th:href="@{/signup}" th:text="#{nav.signup}">Sign Up</a>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link" href="#">
                        <span th:text="#{welcome.user}">Bienvenue</span>
                        <span sec:authentication="name"></span>
                    </a>
                </li>


                <li class="nav-item" sec:authorize="isAuthenticated()">
                     <form th:action="@{/logout}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-link nav-link" style="display: inline; padding: 0; border: none; background: none;" th:text="#{nav.logout}">Logout</button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>

</body>
</html>
